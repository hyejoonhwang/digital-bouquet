<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Bouquet - Share Your Gift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=22">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <button class="btn btn-secondary" id="newBouquetBtn">Create Another</button>
            <div class="logo"></div>
            <div class="share-link-header">
                <input type="text" class="link-input" id="shareLink" readonly>
                <button class="btn btn-primary" id="copyBtn">Copy Link</button>
            </div>
        </header>

        <div class="copy-feedback hidden" id="copyFeedback">✓ Link copied to clipboard!</div>

        <!-- Main Content -->
        <main class="letter-content">
            <div class="letter-container">
                <!-- Bouquet Preview -->
                <div class="preview-section no-border">
                    <div class="canvas preview-canvas" id="miniCanvas"></div>
                </div>

                <!-- Letter Preview -->
                <div class="letter-section no-border">
                    <div class="letter-envelope-container">
                        <img src="assets/envelope-open.png" alt="Letter" class="letter-bg">
                        <div class="letter-preview-text" id="letterPreview"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/state.js?v=22"></script>
    <script src="js/canvas.js?v=22"></script>
    <script src="js/firebase.js?v=22"></script>
    <script src="js/app.js?v=22"></script>
</body>
</html>
