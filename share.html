<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Bouquet - Share</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <button class="btn" id="newBouquetBtn">create new</button>
        </header>

        <!-- Main Content -->
        <main class="share-content">
            <h2 class="share-title">your bouquet is ready to send</h2>

            <div class="share-preview" id="sharePreview">
                <div class="canvas preview-canvas" id="miniCanvas"></div>
            </div>

            <button class="copy-btn" id="copyBtn">copy link</button>
            <div class="copy-feedback hidden" id="copyFeedback">link copied!</div>

            <!-- Hidden input for link -->
            <input type="hidden" id="shareLink">
        </main>
    </div>

    <script src="js/state.js"></script>
    <script src="js/canvas.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
