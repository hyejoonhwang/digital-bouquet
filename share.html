<!DOCTYPE html>
<html lang="en" style="height: 100%; overflow: hidden;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Bouquet - Share Your Gift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Josefin+Slab:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=47">
    <style>
        html, body { height: 100%; overflow: hidden; position: fixed; width: 100%; }
    </style>
</head>
<body style="height: 100%; overflow: hidden; position: fixed; width: 100%;">
    <div class="app">
        <!-- Header -->
        <header class="header header-minimal">
            <button class="btn-img" id="newBouquetBtn"><img src="assets/buttons/create another -button.png" alt="Create Another"></button>
        </header>

        <!-- Main Content -->
        <main class="letter-content">
            <div class="letter-container">
                <!-- Bouquet Preview -->
                <div class="preview-section no-border">
                    <div class="canvas preview-canvas" id="miniCanvas"></div>
                </div>

                <!-- Letter Preview -->
                <div class="letter-section no-border">
                    <div class="letter-envelope-container">
                        <img src="assets/envelope-open.png" alt="Letter" class="letter-bg">
                        <div class="letter-preview-text" id="letterPreview"></div>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="share-actions">
                <button class="btn-img" id="downloadBtn" title="Download Bouquet"><img src="assets/buttons/download-icon.png" alt="Download"></button>
                <div class="share-link-row">
                    <input type="text" class="link-input" id="shareLink" readonly>
                    <button class="btn-img" id="copyBtn"><img src="assets/buttons/copy link.png" alt="Copy Link"></button>
                </div>
                <div class="copy-feedback hidden" id="copyFeedback">✓ Link copied to clipboard!</div>
            </div>
        </main>
    </div>

    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="js/state.js?v=37"></script>
    <script src="js/canvas.js?v=37"></script>
    <script src="js/firebase.js?v=37"></script>
    <script src="js/app.js?v=38"></script>
</body>
</html>
