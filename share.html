<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Bouquet - Share Your Gift</title>
    <link rel="stylesheet" href="css/styles.css?v=7">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="logo">🌸 Digital Bouquet</div>
            <button class="btn btn-primary" id="newBouquetBtn">Create Another</button>
        </header>

        <!-- Main Content -->
        <main class="share-content">
            <div class="share-container">
                <div class="success-icon">🎉</div>
                <h2>Your bouquet is ready to send!</h2>
                <p class="share-description">Copy this link and share it with your friend:</p>

                <div class="link-container">
                    <input type="text" class="link-input" id="shareLink" readonly>
                    <button class="btn btn-primary" id="copyBtn">📋 Copy</button>
                </div>

                <div class="copy-feedback hidden" id="copyFeedback">✓ Link copied to clipboard!</div>

                <div class="share-note">
                    <p>📌 This link will expire in 7 days</p>
                </div>

                <!-- Preview of what was sent -->
                <div class="sent-preview">
                    <h3>What you're sending:</h3>
                    <div class="mini-preview">
                        <div class="canvas mini-canvas" id="miniCanvas"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/state.js?v=7"></script>
    <script src="js/canvas.js?v=7"></script>
    <script src="js/firebase.js?v=7"></script>
    <script src="js/app.js?v=7"></script>
</body>
</html>
