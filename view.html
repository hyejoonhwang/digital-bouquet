<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Bouquet - You Have a Gift!</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app view-app">
        <!-- Envelope View (Initial) -->
        <div class="envelope-view" id="envelopeView">
            <h1 class="gift-title">You received a bouquet!</h1>

            <div class="envelope-container" id="envelopeContainer">
                <div class="envelope" id="envelope">
                    <div class="envelope-flap"></div>
                    <div class="envelope-body">
                        <span class="envelope-icon">✉</span>
                    </div>
                </div>
            </div>

            <p class="open-hint">Click to open your gift</p>
        </div>

        <!-- Revealed Content (After clicking envelope) -->
        <div class="revealed-view hidden" id="revealedView">
            <header class="header">
                <button class="btn" id="createOwnBtn">create new</button>
            </header>

            <main class="revealed-content">
                <div class="revealed-container">
                    <!-- Bouquet -->
                    <div class="revealed-section">
                        <div class="canvas preview-canvas" id="revealedCanvas"></div>
                    </div>

                    <!-- Letter -->
                    <div class="revealed-section">
                        <div class="revealed-postcard">
                            <p class="revealed-postcard-content" id="revealedLetter"></p>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- Expired/Error View -->
        <div class="error-view hidden" id="errorView">
            <div class="error-container">
                <h2>This bouquet has expired</h2>
                <p>This link has expired or doesn't exist.</p>
                <button class="btn" id="createNewBtn">create new</button>
            </div>
        </div>
    </div>

    <script src="js/state.js"></script>
    <script src="js/canvas.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
