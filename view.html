<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Bouquet - You Have a Gift!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Josefin+Slab:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=34">
</head>
<body>
    <div class="app">
        <!-- First Page: Closed Envelope -->
        <div class="envelope-view" id="envelopeView">
            <main class="envelope-page">
                <h1 class="gift-title">You received a bouquet!</h1>
                <div class="closed-envelope-container" id="envelopeContainer">
                    <img src="assets/envelope-closed.png" alt="Envelope" class="closed-envelope" id="closedEnvelope">
                </div>
                <p class="open-hint">Click the envelope to open your gift</p>
            </main>
        </div>

        <!-- Second Page: Bouquet + Opened Envelope with Letter -->
        <div class="revealed-view hidden" id="revealedView">
            <header class="header">
                <div class="logo"></div>
                <button class="btn-img" id="createOwnBtn"><img src="assets/buttons/create-button.png" alt="Create Your Own"></button>
            </header>

            <main class="letter-content">
                <div class="letter-container">
                    <!-- Bouquet Preview -->
                    <div class="preview-section no-border">
                        <div class="canvas preview-canvas" id="revealedCanvas"></div>
                    </div>

                    <!-- Letter in Opened Envelope -->
                    <div class="letter-section no-border">
                        <div class="letter-envelope-container">
                            <img src="assets/envelope-open.png" alt="Letter" class="letter-bg">
                            <div class="letter-preview-text" id="revealedLetter"></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- Error View -->
        <div class="error-view hidden" id="errorView">
            <div class="error-container">
                <h2>Oops! This bouquet has wilted</h2>
                <p>This link has expired or doesn't exist.</p>
                <button class="btn-img" id="createNewBtn"><img src="assets/buttons/create-button.png" alt="Create a New Bouquet"></button>
            </div>
        </div>
    </div>

    <script src="js/state.js?v=34"></script>
    <script src="js/canvas.js?v=34"></script>
    <script src="js/firebase.js?v=34"></script>
    <script src="js/app.js?v=34"></script>
</body>
</html>
