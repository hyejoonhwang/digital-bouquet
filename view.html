<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Bouquet - You Have a Gift!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Slab:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=33">
</head>
<body>
    <div class="app view-app">
        <!-- Envelope View (Initial) -->
        <div class="envelope-view" id="envelopeView">
            <h1 class="gift-title">You received a bouquet! 💐</h1>

            <div class="envelope-container" id="envelopeContainer">
                <div class="envelope" id="envelope">
                    <div class="envelope-flap"></div>
                    <div class="envelope-body">
                        <span class="envelope-icon">💌</span>
                    </div>
                </div>
            </div>

            <p class="open-hint">Click the envelope to open your gift</p>
        </div>

        <!-- Revealed Content (After clicking envelope) -->
        <div class="revealed-view hidden" id="revealedView">
            <header class="header">
                <div class="logo"></div>
                <button class="btn-img" id="createOwnBtn"><img src="assets/buttons/create-button.png" alt="Create Your Own"></button>
            </header>

            <main class="revealed-content">
                <div class="revealed-container">
                    <!-- Bouquet -->
                    <div class="revealed-section">
                        <div class="canvas preview-canvas" id="revealedCanvas"></div>
                    </div>

                    <!-- Letter -->
                    <div class="revealed-letter-section">
                        <div class="letter-paper revealed-letter">
                            <p class="letter-content" id="revealedLetter"></p>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- Expired/Error View -->
        <div class="error-view hidden" id="errorView">
            <div class="error-container">
                <div class="error-icon">🥀</div>
                <h2>Oops! This bouquet has wilted</h2>
                <p>This link has expired or doesn't exist.</p>
                <button class="btn-img" id="createNewBtn"><img src="assets/buttons/create-button.png" alt="Create a New Bouquet"></button>
            </div>
        </div>
    </div>

    <script src="js/state.js?v=33"></script>
    <script src="js/canvas.js?v=33"></script>
    <script src="js/firebase.js?v=33"></script>
    <script src="js/app.js?v=33"></script>
</body>
</html>
