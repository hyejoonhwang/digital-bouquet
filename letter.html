<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Bouquet - Write Your Letter</title>
    <link rel="stylesheet" href="css/styles.css?v=10">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <button class="btn btn-secondary" id="backBtn">← Back</button>
            <div class="logo">🌸 Digital Bouquet</div>
            <button class="btn btn-primary" id="sendBtn">Send →</button>
        </header>

        <!-- Main Content -->
        <main class="letter-content">
            <div class="letter-container">
                <!-- Bouquet Preview -->
                <div class="preview-section no-border">
                    <div class="canvas preview-canvas" id="previewCanvas"></div>
                </div>

                <!-- Letter Editor -->
                <div class="letter-section no-border">
                    <h3>Send love to your valentine</h3>
                    <div class="letter-envelope-container">
                        <img src="assets/envelope-open.png" alt="Letter" class="letter-bg">
                        <textarea
                            class="letter-textarea"
                            id="letterText"
                            placeholder="Write your heartfelt message here..."
                            maxlength="1000"
                        ></textarea>
                    </div>
                    <div class="char-count" id="charCount">0/1000</div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/state.js?v=10"></script>
    <script src="js/canvas.js?v=10"></script>
    <script src="js/app.js?v=10"></script>
</body>
</html>
