<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Bouquet - Write Your Letter</title>
    <link rel="stylesheet" href="css/styles.css?v=5">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <button class="btn btn-secondary" id="backBtn">← Back</button>
            <div class="logo">🌸 Digital Bouquet</div>
            <button class="btn btn-primary" id="sendBtn">Send →</button>
        </header>

        <!-- Main Content -->
        <main class="letter-content">
            <div class="letter-container">
                <!-- Bouquet Preview -->
                <div class="preview-section">
                    <h3>Your Bouquet</h3>
                    <div class="canvas preview-canvas" id="previewCanvas"></div>
                </div>

                <!-- Letter Editor -->
                <div class="letter-section">
                    <h3>Your Message</h3>
                    <textarea
                        class="letter-textarea"
                        id="letterText"
                        placeholder="Dear friend,

Write your heartfelt message here...

With love,"
                        maxlength="1000"
                    ></textarea>
                    <div class="char-count" id="charCount">0/1000</div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/state.js?v=5"></script>
    <script src="js/canvas.js?v=5"></script>
    <script src="js/app.js?v=5"></script>
</body>
</html>
