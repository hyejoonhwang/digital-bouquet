<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Bouquet - Letter</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header with-back">
            <button class="btn" id="backBtn">back</button>
            <button class="btn" id="previewBtn">preview</button>
        </header>

        <!-- Main Content -->
        <main class="letter-content">
            <div class="letter-container">
                <!-- Bouquet Preview -->
                <div class="preview-section">
                    <div class="section-label">your bouquet</div>
                    <div class="canvas preview-canvas" id="previewCanvas"></div>
                </div>

                <!-- Letter Editor -->
                <div class="letter-section">
                    <div class="section-label">your message<br>-empty postcard</div>
                    <textarea
                        class="letter-textarea"
                        id="letterText"
                        placeholder="your message
-empty postcard"
                        maxlength="1000"
                    ></textarea>
                </div>
            </div>
        </main>
    </div>

    <script src="js/state.js"></script>
    <script src="js/canvas.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
