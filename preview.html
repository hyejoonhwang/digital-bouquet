<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Bouquet - Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Josefin+Slab:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=34">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <button class="btn-img" id="editBtn"><img src="assets/buttons/back.png" alt="Edit"></button>
            <div class="logo"></div>
            <button class="btn-img" id="confirmBtn"><img src="assets/buttons/confirm and get link.png" alt="Confirm & Get Link"></button>
        </header>

        <!-- Main Content -->
        <main class="letter-content">
            <div class="letter-container">
                <!-- Bouquet Preview -->
                <div class="preview-section no-border">
                    <div class="canvas preview-canvas" id="previewCanvas"></div>
                </div>

                <!-- Letter Preview -->
                <div class="letter-section no-border">
                    <div class="letter-envelope-container">
                        <img src="assets/envelope-open.png" alt="Letter" class="letter-bg">
                        <div class="letter-preview-text" id="letterPreview"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/state.js?v=34"></script>
    <script src="js/canvas.js?v=34"></script>
    <script src="js/firebase.js?v=34"></script>
    <script src="js/app.js?v=34"></script>
</body>
</html>
