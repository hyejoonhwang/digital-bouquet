<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Bouquet - Preview</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header with-center">
            <button class="btn" id="editBtn">edit</button>
            <span class="header-center">preview page</span>
            <button class="btn" id="sendBtn">send</button>
        </header>

        <!-- Main Content -->
        <main class="preview-content">
            <div class="preview-container">
                <!-- Bouquet Preview -->
                <div class="preview-section">
                    <div class="section-label">your bouquet</div>
                    <div class="canvas preview-canvas" id="previewCanvas"></div>
                </div>

                <!-- Letter Preview -->
                <div class="letter-preview-section">
                    <div class="section-label">your message<br>written in font Cedarville Cursive on the postcard</div>
                    <div class="postcard">
                        <p class="postcard-content" id="letterPreview"></p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/state.js"></script>
    <script src="js/canvas.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
