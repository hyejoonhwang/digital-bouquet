<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Bouquet - Preview</title>
    <link rel="stylesheet" href="css/styles.css?v=16">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <button class="btn btn-secondary" id="editBtn">← Edit</button>
            <div class="logo">🌸 Digital Bouquet</div>
            <button class="btn btn-primary" id="confirmBtn">Confirm & Get Link</button>
        </header>

        <!-- Main Content -->
        <main class="preview-content">
            <h2 class="preview-title">Preview - This is what your friend will see</h2>

            <div class="preview-container">
                <!-- Bouquet Preview -->
                <div class="preview-section">
                    <div class="canvas preview-canvas" id="previewCanvas"></div>
                </div>

                <!-- Letter Preview -->
                <div class="letter-preview-section">
                    <div class="letter-paper">
                        <p class="letter-content" id="letterPreview"></p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/state.js?v=16"></script>
    <script src="js/canvas.js?v=16"></script>
    <script src="js/firebase.js?v=16"></script>
    <script src="js/app.js?v=16"></script>
</body>
</html>
