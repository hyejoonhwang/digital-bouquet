<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Bouquet</title>
    <link rel="stylesheet" href="css/styles.css?v=15">
</head>
<body>
    <div class="app landing-page">
        <!-- Header - just create button -->
        <header class="header header-minimal">
            <button class="btn btn-primary" id="createBtn">create</button>
        </header>

        <!-- Main Content - Canvas centered -->
        <main class="main-content">
            <div class="canvas-area">
                <!-- Canvas/Wrapper Area -->
                <div class="canvas-container">
                    <div class="canvas" id="canvas">
                        <div class="canvas-placeholder">Drag flowers here</div>
                    </div>
                </div>

                <!-- Action Buttons (below canvas) -->
                <div class="action-icons">
                    <button class="icon-btn" id="undoBtn" title="Undo">↩</button>
                    <button class="icon-btn" id="shuffleBtn" title="Shuffle">⟳</button>
                    <button class="icon-btn" id="redoBtn" title="Redo">↪</button>
                </div>
            </div>
        </main>

        <!-- Bottom Panel - Fixed at bottom -->
        <footer class="bottom-panel">
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" data-tab="flowers">flower</button>
                <button class="tab" data-tab="wrapper">wrapper</button>
            </div>

            <!-- Palette Container -->
            <div class="palette-container">
                <!-- Flowers Palette -->
                <div class="palette" id="flowersPalette">
                    <div class="palette-item flower" data-type="1" style="background: #FF6B6B;" draggable="true"></div>
                    <div class="palette-item flower" data-type="2" style="background: #FF8E53;" draggable="true"></div>
                    <div class="palette-item flower" data-type="3" style="background: #FFCD38;" draggable="true"></div>
                    <div class="palette-item flower" data-type="4" style="background: #6BCB77;" draggable="true"></div>
                    <div class="palette-item flower" data-type="5" style="background: #4D96FF;" draggable="true"></div>
                    <div class="palette-item flower" data-type="6" style="background: #9B59B6;" draggable="true"></div>
                    <div class="palette-item flower" data-type="7" style="background: #E91E63;" draggable="true"></div>
                    <div class="palette-item flower" data-type="8" style="background: #00BCD4;" draggable="true"></div>
                    <div class="palette-item flower" data-type="9" style="background: #FF5722;" draggable="true"></div>
                    <div class="palette-item flower" data-type="10" style="background: #8BC34A;" draggable="true"></div>
                </div>

                <!-- Wrapper Palette -->
                <div class="palette hidden" id="wrapperPalette">
                    <div class="palette-item wrapper" data-wrapper="1" style="background-image: url('assets/wrappers/wrapper01.png');"></div>
                    <div class="palette-item wrapper" data-wrapper="2" style="background-image: url('assets/wrappers/wrapper02.png');"></div>
                    <div class="palette-item wrapper" data-wrapper="3" style="background-image: url('assets/wrappers/wrapper03.png');"></div>
                    <div class="palette-item wrapper" data-wrapper="4" style="background-image: url('assets/wrappers/wrapper04.png');"></div>
                    <div class="palette-item wrapper" data-wrapper="5" style="background-image: url('assets/wrappers/wrapper05.png');"></div>
                    <div class="palette-item wrapper" data-wrapper="6" style="background-image: url('assets/wrappers/wrapper06.png');"></div>
                    <div class="palette-item wrapper" data-wrapper="7" style="background-image: url('assets/wrappers/wrapper07.png');"></div>
                    <div class="palette-item wrapper" data-wrapper="8" style="background-image: url('assets/wrappers/wrapper08.png');"></div>
                </div>

                <!-- Slider placeholder -->
                <div class="palette-slider"></div>
            </div>
        </footer>
    </div>

    <script src="js/state.js?v=15"></script>
    <script src="js/canvas.js?v=15"></script>
    <script src="js/app.js?v=15"></script>
</body>
</html>
