<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Bouquet</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <button class="btn" id="createBtn">create</button>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Canvas -->
            <div class="canvas-container">
                <div class="canvas" id="canvas">
                    <div class="canvas-placeholder">wrapper<br>(flowers are going to be dragged to this wrapper)<br>no additional ui layer needed)</div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="action-btn" id="undoBtn">↩</button>
                <button class="action-btn" id="shuffleBtn">⟳</button>
                <button class="action-btn" id="redoBtn">↪</button>
            </div>

            <!-- Bottom Panel -->
            <div class="bottom-panel">
                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab active" data-tab="flowers">flower</button>
                    <button class="tab" data-tab="wrapper">wrapper</button>
                </div>

                <!-- Palette Container -->
                <div class="palette-container">
                    <!-- Flowers Palette -->
                    <div class="palette" id="flowersPalette">
                        <div class="palette-item flower" data-type="1" style="background: #888;" draggable="true"></div>
                        <div class="palette-item flower" data-type="2" style="background: #888;" draggable="true"></div>
                        <div class="palette-item flower" data-type="3" style="background: #888;" draggable="true"></div>
                        <div class="palette-item flower" data-type="4" style="background: #888;" draggable="true"></div>
                        <div class="palette-item flower" data-type="5" style="background: #888;" draggable="true"></div>
                        <div class="palette-item flower" data-type="6" style="background: #888;" draggable="true"></div>
                        <div class="palette-item flower" data-type="7" style="background: #888;" draggable="true"></div>
                        <div class="palette-item flower" data-type="8" style="background: #888;" draggable="true"></div>
                        <div class="palette-item flower" data-type="9" style="background: #888;" draggable="true"></div>
                        <div class="palette-item flower" data-type="10" style="background: #888;" draggable="true"></div>
                    </div>

                    <!-- Wrapper Palette -->
                    <div class="palette hidden" id="wrapperPalette">
                        <div class="palette-item wrapper" data-wrapper="1" style="background: #888;"></div>
                        <div class="palette-item wrapper" data-wrapper="2" style="background: #aaa;"></div>
                        <div class="palette-item wrapper" data-wrapper="3" style="background: #bbb;"></div>
                    </div>

                    <!-- Slider -->
                    <div class="palette-slider"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/state.js"></script>
    <script src="js/canvas.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
